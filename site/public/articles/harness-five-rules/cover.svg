<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <rect width="1600" height="640" fill="#ffffff"/>

  <!-- eyebrow -->
  <text x="110" y="205" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="4" fill="#666">HARNESS ENGINEERING · FIVE RULES</text>

  <!-- title -->
  <text x="110" y="300" font-size="62" font-weight="700" fill="#111">别再给 Agent 写嘱咐了</text>
  <text x="110" y="365" font-size="26" fill="#444">Harness Engineering 的五条实战规则</text>

  <line x1="110" y1="412" x2="780" y2="412" stroke="#eaeaea" stroke-width="1"/>

  <!-- five rules preview -->
  <g font-size="15" fill="#666">
    <text x="110" y="462"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#999">01</tspan>&#160;&#160;&#160;清理代码库：代码本身就是提示词</text>
    <text x="110" y="492"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#999">02</tspan>&#160;&#160;&#160;纠错沉淀为 lint、类型与架构规则</text>
    <text x="110" y="522"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#999">03</tspan>&#160;&#160;&#160;给 agent 自运行、自检查的工具</text>
    <text x="110" y="552"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#999">04</tspan>&#160;&#160;&#160;用证据代替 agent 的自述</text>
    <text x="110" y="582"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#999">05</tspan>&#160;&#160;&#160;把 token 花在验证上</text>
  </g>

  <!-- right motif: AGENTS.md card -> lint card -->
  <g>
    <rect x="1020" y="110" width="300" height="150" rx="10" fill="#ffffff" stroke="#cbcbcb" stroke-width="1" stroke-dasharray="6 5"/>
    <text x="1170" y="152" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#444">AGENTS.md</text>
    <rect x="1060" y="172" width="220" height="3" fill="#eaeaea"/>
    <rect x="1060" y="188" width="180" height="3" fill="#eaeaea"/>
    <rect x="1060" y="204" width="200" height="3" fill="#eaeaea"/>
    <text x="1170" y="240" text-anchor="middle" font-size="12" fill="#666">建议性 · 可能被忽略</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0070f3"/>
    </marker>
  </defs>
  <line x1="1170" y1="278" x2="1170" y2="338" stroke="#0070f3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1192" y="314" font-size="14" fill="#0070f3">沉淀为确定性检查</text>

  <g>
    <rect x="1020" y="360" width="300" height="150" rx="10" fill="#fafafa" stroke="#cbcbcb" stroke-width="1.5"/>
    <text x="1150" y="428" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#111">lint · 类型 · 测试</text>
    <text x="1150" y="456" text-anchor="middle" font-size="12" fill="#444">确定性 · 必然执行</text>
    <circle cx="1282" cy="392" r="14" fill="#0070f3"/>
    <path d="M 1275 392 L 1281 398 L 1290 386" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
