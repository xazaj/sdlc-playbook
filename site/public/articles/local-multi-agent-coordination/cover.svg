<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">消息总线与控制平面的对比</title>
  <desc id="coverDesc">左边是消息总线：每条消息都进入主 Agent 的上下文；右边是控制平面：主 Agent 只收到任务信封，worker 在独立 worktree 中执行。</desc>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0070f3"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #eaeaea; stroke-width: 1; }
    .soft { fill: #fafafa; stroke: #eaeaea; stroke-width: 1; }
    .ink { fill: #111111; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .mid { fill: #444444; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .dim { fill: #666666; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .mono { fill: #666666; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; }
    .blue { fill: #0070f3; }
    .lineGray { stroke: #cccccc; stroke-width: 1.5; stroke-dasharray: 4 5; fill: none; }
    .lineBlue { stroke: #0070f3; stroke-width: 1.5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <text class="mono" x="40" y="38" font-size="18.0">MULTI-AGENT COORDINATION</text>
  <text class="ink" x="40" y="92" font-size="48.0" font-weight="600">Bus vs. control plane</text>
  <text class="mid" x="40" y="128" font-size="22.5">Same agents. Different place for the context to grow.</text>

  <!-- left panel -->
  <rect class="panel" x="40" y="140" width="540" height="450" rx="12"/>
  <text class="mono" x="64" y="174" font-size="18.0">MESSAGE BUS</text>
  <rect class="soft" x="190" y="196" width="240" height="64" rx="8"/>
  <text class="ink" x="310" y="218" font-size="24.0" font-weight="600" text-anchor="middle">Main agent</text>
  <text class="dim" x="310" y="246" font-size="16.5" text-anchor="middle">context = every message</text>

  <path class="lineGray" d="M 310 260 L 127 320" marker-end="url(#arrowGray)"/>
  <path class="lineGray" d="M 310 260 L 251 320" marker-end="url(#arrowGray)"/>
  <path class="lineGray" d="M 310 260 L 375 320" marker-end="url(#arrowGray)"/>
  <path class="lineGray" d="M 310 260 L 499 320" marker-end="url(#arrowGray)"/>

  <rect class="soft" x="72" y="320" width="110" height="52" rx="8"/>
  <text class="ink" x="127" y="338" font-size="19.5" font-weight="500" text-anchor="middle">Claude</text>
  <text class="dim" x="127" y="362" font-size="15.0" text-anchor="middle">session</text>
  <rect class="soft" x="196" y="320" width="110" height="52" rx="8"/>
  <text class="ink" x="251" y="338" font-size="19.5" font-weight="500" text-anchor="middle">Codex</text>
  <text class="dim" x="251" y="362" font-size="15.0" text-anchor="middle">session</text>
  <rect class="soft" x="320" y="320" width="110" height="52" rx="8"/>
  <text class="ink" x="375" y="338" font-size="19.5" font-weight="500" text-anchor="middle">pi</text>
  <text class="dim" x="375" y="362" font-size="15.0" text-anchor="middle">session</text>
  <rect class="soft" x="444" y="320" width="110" height="52" rx="8"/>
  <text class="ink" x="499" y="338" font-size="19.5" font-weight="500" text-anchor="middle">omp</text>
  <text class="dim" x="499" y="362" font-size="15.0" text-anchor="middle">session</text>

  <text class="dim" x="64" y="430" font-size="18.0">Every message lands in the main context.</text>
  <text class="dim" x="64" y="454" font-size="18.0">Later turns read it again.</text>
  <rect x="64" y="480" width="250" height="1" fill="#eaeaea"/>
  <text class="mono" x="64" y="508" font-size="16.5">NO TASK GRAPH</text>
  <text class="mono" x="64" y="528" font-size="16.5">NO CLAIM / NO CHECKS</text>
  <text class="mono" x="64" y="548" font-size="16.5">NO WORKTREE ISOLATION</text>

  <!-- right panel -->
  <rect class="panel" x="620" y="140" width="540" height="450" rx="12"/>
  <text class="mono blue" x="644" y="174" font-size="18.0">CONTROL PLANE</text>
  <rect class="soft" x="770" y="196" width="240" height="64" rx="8"/>
  <text class="ink" x="890" y="218" font-size="24.0" font-weight="600" text-anchor="middle">Main agent</text>
  <text class="dim" x="890" y="246" font-size="16.5" text-anchor="middle">plans · adjudicates · reviews</text>

  <path class="lineBlue" d="M 890 260 L 890 300" marker-end="url(#arrowBlue)"/>
  <rect class="soft" x="760" y="300" width="260" height="64" rx="8"/>
  <text class="ink" x="890" y="322" font-size="21.0" font-weight="600" text-anchor="middle">Beads · SQLite · orch</text>
  <text class="dim" x="890" y="348" font-size="15.0" text-anchor="middle">graph · run state · dispatch</text>

  <path class="lineBlue" d="M 890 364 L 730 410" marker-end="url(#arrowBlue)"/>
  <path class="lineBlue" d="M 890 364 L 880 410" marker-end="url(#arrowBlue)"/>
  <path class="lineBlue" d="M 890 364 L 1030 410" marker-end="url(#arrowBlue)"/>

  <rect class="soft" x="660" y="410" width="140" height="64" rx="8"/>
  <text class="ink" x="730" y="432" font-size="19.5" font-weight="500" text-anchor="middle">Claude</text>
  <text class="dim" x="730" y="456" font-size="15.0" text-anchor="middle">worktree</text>
  <rect class="soft" x="810" y="410" width="140" height="64" rx="8"/>
  <text class="ink" x="880" y="432" font-size="19.5" font-weight="500" text-anchor="middle">Codex</text>
  <text class="dim" x="880" y="456" font-size="15.0" text-anchor="middle">worktree</text>
  <rect class="soft" x="960" y="410" width="140" height="64" rx="8"/>
  <text class="ink" x="1030" y="432" font-size="19.5" font-weight="500" text-anchor="middle">pi / omp</text>
  <text class="dim" x="1030" y="456" font-size="15.0" text-anchor="middle">worktree</text>

  <path class="lineBlue" d="M 1020 332 C 1120 332 1120 228 1012 228" marker-end="url(#arrowBlue)"/>
  <text class="blue" x="1060" y="286" font-size="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">envelope</text>
  <text class="dim" x="1060" y="308" font-size="15.0">≤ 500 tokens</text>

  <text class="dim" x="644" y="520" font-size="18.0">Main sees summaries, not transcripts.</text>
  <text class="dim" x="644" y="544" font-size="18.0">L0 progress stays in SQLite.</text>
</svg>
