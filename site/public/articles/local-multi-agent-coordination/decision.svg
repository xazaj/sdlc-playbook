<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="decisionTitle decisionDesc">
  <title id="decisionTitle">从 v0 开始，按痛点加层</title>
  <desc id="decisionDesc">先跑 Beads、SQLite、CLI 和两个 adapter 组成的 v0；只有出现人类看板、空闲推送、跨会话调度或多机需求时，才分别加入 Kanzo、agentbus、daemon 或 Dolt 同步。</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0070f3"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #fafafa; stroke: #eaeaea; stroke-width: 1; }
    .center { fill: #ffffff; stroke: #0070f3; stroke-width: 1.5; }
    .ink { fill: #111111; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .mid { fill: #444444; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .dim { fill: #666666; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .mono { fill: #666666; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; }
    .blue { fill: #0070f3; }
    .line { stroke: #0070f3; stroke-width: 1.5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="620"/>
  <text class="mono" x="40" y="38" font-size="18.0">CHOOSE THE SMALLEST SYSTEM</text>
  <text class="ink" x="40" y="88" font-size="45.0" font-weight="600">Start small. Add a layer when it hurts.</text>
  <text class="mid" x="40" y="124" font-size="21.0">A layer without a past pain is a future incident.</text>

  <rect class="center" x="470" y="250" width="260" height="96" rx="10"/>
  <text class="blue" x="600" y="276" font-size="16.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">V0</text>
  <text class="ink" x="600" y="308" font-size="27.0" font-weight="600" text-anchor="middle">Beads + SQLite + CLI</text>
  <text class="dim" x="600" y="334" font-size="16.5" text-anchor="middle">Claude + Codex · worktree · envelope</text>

  <rect class="box" x="440" y="94" width="320" height="86" rx="8"/>
  <text class="mono" x="460" y="116" font-size="15.0">HUMAN BOARD</text>
  <text class="ink" x="460" y="146" font-size="21.0" font-weight="500">Kanzo</text>
  <text class="dim" x="460" y="170" font-size="15.0">when a person needs cards and comments</text>

  <rect class="box" x="850" y="250" width="300" height="110" rx="8"/>
  <text class="mono" x="870" y="272" font-size="15.0">IDLE L2 PUSH</text>
  <text class="ink" x="870" y="302" font-size="21.0" font-weight="500">agentbus / AgentBridge</text>
  <text class="dim" x="870" y="326" font-size="15.0">when the main agent must wake up</text>
  <text class="dim" x="870" y="346" font-size="15.0">without a user turn</text>

  <rect class="box" x="440" y="440" width="320" height="86" rx="8"/>
  <text class="mono" x="460" y="462" font-size="15.0">CROSS-SESSION SCHEDULING</text>
  <text class="ink" x="460" y="492" font-size="21.0" font-weight="500">daemon</text>
  <text class="dim" x="460" y="516" font-size="15.0">when retries must survive the main session</text>

  <rect class="box" x="60" y="250" width="300" height="110" rx="8"/>
  <text class="mono" x="80" y="272" font-size="15.0">MULTI-MACHINE</text>
  <text class="ink" x="80" y="302" font-size="21.0" font-weight="500">Dolt sync + claim</text>
  <text class="dim" x="80" y="326" font-size="15.0">when a second machine actually joins</text>
  <text class="dim" x="80" y="346" font-size="15.0">not before</text>

  <path class="line" d="M 600 250 L 600 176" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 730 298 L 850 298" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 600 346 L 600 440" marker-end="url(#arrowBlue)"/>
  <path class="line" d="M 470 298 L 360 298" marker-end="url(#arrowBlue)"/>

  <text class="dim" x="40" y="580" font-size="18.0">The v0 is the product. The rest are options with a trigger.</text>
</svg>
