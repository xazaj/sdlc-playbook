<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="coverTitle coverDesc">
  <title id="coverTitle">适配器谱系：从进程内子代理到终端模拟</title>
  <desc id="coverDesc">四个档位从左到右：进程内 subagent、原生 RPC、MCP 包装、tmux 终端模拟。纵轴是控制深度，横轴是异构容忍度；每往右一档，适配器更通用，但拿到的信息更粗。</desc>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0070f3"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #ffffff; stroke: #eaeaea; stroke-width: 1; }
    .soft { fill: #fafafa; stroke: #eaeaea; stroke-width: 1; }
    .ink { fill: #111111; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .mid { fill: #444444; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .dim { fill: #666666; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    .mono { fill: #666666; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; }
    .blue { fill: #0070f3; }
    .lineGray { stroke: #cccccc; stroke-width: 1.5; fill: none; }
    .axis { stroke: #bbbbbb; stroke-width: 1.5; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="640"/>
  <text class="mono" x="40" y="38" font-size="18.0">MULTI-AGENT ORCHESTRATION SURVEY</text>
  <text class="ink" x="40" y="92" font-size="48.0" font-weight="600">The adapter spectrum</text>
  <text class="mid" x="40" y="128" font-size="22.5">每多接一种 agent，适配器就往通用的一侧退一步。</text>

  <!-- axes -->
  <path class="axis" d="M 96 480 L 1150 480" marker-end="url(#arrowGray)"/>
  <path class="axis" d="M 96 480 L 96 208" marker-end="url(#arrowGray)"/>
  <text class="dim" x="1148" y="512" font-size="16.5" text-anchor="end">异构容忍度 →</text>
  <text class="dim" x="76" y="206" font-size="16.5" text-anchor="start" transform="rotate(-90 76 206)">控制深度 →</text>

  <!-- tier 1: in-process -->
  <rect class="panel" x="128" y="198" width="230" height="120" rx="10"/>
  <text class="mono" x="150" y="228" font-size="14.0">TIER 1 · IN-PROCESS</text>
  <text class="ink" x="150" y="256" font-size="21.0" font-weight="600">进程内 subagent</text>
  <text class="dim" x="150" y="282" font-size="15.0">同一进程、同一事件总线</text>
  <text class="dim" x="150" y="304" font-size="14.0">pi-subagents · 原生 teams</text>

  <!-- tier 2: native rpc -->
  <rect class="panel" x="392" y="242" width="230" height="120" rx="10"/>
  <text class="mono" x="414" y="272" font-size="14.0">TIER 2 · NATIVE RPC</text>
  <text class="ink" x="414" y="300" font-size="21.0" font-weight="600">原生 RPC / headless</text>
  <text class="dim" x="414" y="326" font-size="15.0">NDJSON 事件流、精确退出码</text>
  <text class="dim" x="414" y="348" font-size="14.0">grokbot · Omnigent</text>

  <!-- tier 3: mcp wrap -->
  <rect class="panel" x="656" y="286" width="230" height="120" rx="10"/>
  <text class="mono" x="678" y="316" font-size="14.0">TIER 3 · MCP WRAP</text>
  <text class="ink" x="678" y="344" font-size="21.0" font-weight="600">MCP 包装</text>
  <text class="dim" x="678" y="370" font-size="15.0">标准化调用，逐家维护 wrapper</text>
  <text class="dim" x="678" y="392" font-size="14.0">OMC v4.3 的 x / g（已移除）</text>

  <!-- tier 4: tmux -->
  <rect class="panel" x="920" y="330" width="230" height="120" rx="10"/>
  <text class="mono" x="942" y="360" font-size="14.0">TIER 4 · PTY</text>
  <text class="ink" x="942" y="388" font-size="21.0" font-weight="600">tmux / 终端模拟</text>
  <text class="dim" x="942" y="414" font-size="15.0">契约只剩「能在终端跑」</text>
  <text class="dim" x="942" y="436" font-size="14.0">OMC · CAO · claude-squad</text>

  <!-- contract line under tiers -->
  <path class="lineGray" d="M 243 322 C 300 480 900 480 1035 454" stroke-dasharray="4 5"/>
  <text class="dim" x="560" y="540" font-size="16.5" text-anchor="middle">契约从「同一进程」一路退到「能在终端里跑」——每退一步，事件流变粗一档</text>
  <text class="blue" x="560" y="574" font-size="16.5" text-anchor="middle" font-weight="500">worker 少于三五个：停在 Tier 2，薄 RPC adapter 是最划算的位置</text>
</svg>
